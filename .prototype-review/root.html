<sc-if value="{{ isAccount }}" hint-placeholder-val="{{ false }}"><dc-import name="RzAccount" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isCorner }}" hint-placeholder-val="{{ false }}"><dc-import name="RzCorner" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isDash }}" hint-placeholder-val="{{ false }}"><iframe ref="{{ dashRef }}" title="Realtor dashboard" style="display:block;width:100%;height:100vh;border:0"></iframe></sc-if>
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}"><dc-import name="RzLogin" key="{{ loginKey }}" hint-size="100%,100vh"></dc-import></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  state = (()=>{const h=(location.hash||'').slice(1); if(!h||h==='home'){try{localStorage.removeItem('rz_cust');localStorage.removeItem('rz_tab');}catch(e){} if(!h)history.replaceState(null,'','#home');} return { r: h||'home' };})();
  componentDidMount() {
    this._h = () => { this.setState({ r: (location.hash || '#home').slice(1) }); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', this._h);
  }
  componentWillUnmount() { window.removeEventListener('hashchange', this._h); }
  renderVals() {
    const raw = this.state.r, login = /^(login|signup)/.test(raw);
    const r = raw==='dashboard' ? 'dashboard' : login ? 'login' : ['home','list','realtor','corner','account'].includes(raw) ? raw : 'home';
    return { dashRef: el => { if (el && window.RZ_DASH && !el.__rz) { el.__rz = 1;
        const hook = () => { try { const d = el.contentDocument; if (!d || d.__rzHook) return; d.__rzHook = 1; d.addEventListener('click', e => { const t = e.target && e.target.closest && e.target.closest('[data-rz-home],[aria-label="Rezide home"]'); if (t) { e.preventDefault(); e.stopPropagation(); location.hash = 'home'; } }, true); } catch (x) {} };
        el.addEventListener('load', hook); const iv = setInterval(() => { hook(); try { const d = el.contentDocument; if (d && d.querySelector('[data-rz-home]')) { d.__rzHook = 0; hook(); clearInterval(iv); } } catch (x) {} }, 500); setTimeout(() => clearInterval(iv), 20000);
        el.srcdoc = window.RZ_DASH; } }, isDash: raw==='dashboard', isLogin: login, loginKey: raw, isHome: r==='home', isList: r==='list', isRealtor: r==='realtor', isCorner: r==='corner', isAccount: r==='account' };
  }
}
</script>


</body></html>
